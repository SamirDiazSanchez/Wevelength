<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1226" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Wavelength - Palabras</title>
</head>
<body>
  <main id="app">
    <div class="words">
      <div class="word" id="wa"></div>
      <div class="word" id="wb"></div>
    </div>
    <div class="actions">
      <button id="prev" aria-label="Anterior">←</button>

      <button id="next" class="primary">Siguiente</button>
    </div>
    <div class="counter" id="counter"></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
